name: Mantener Supabase activo

# Dos consultas a la semana para que el plan gratuito no pause el proyecto por inactividad.
# Solo usa la URL y la clave PÚBLICA (publishable), las mismas que ya están en index.html.
# No lee ni escribe datos: con esa clave y sin sesión, la tabla "datos" responde "sin permiso".
# Si el proyecto estuviera pausado o caído, este flujo falla y GitHub avisa por correo.

on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunes y jueves, 06:17 UTC
  workflow_dispatch:          # también se puede lanzar a mano desde la pestaña Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Consulta a la API de Supabase
        env:
          SB_URL: https://phngwircyqiruohbrpqo.supabase.co
          SB_KEY: sb_publishable_4lGarOFBoq54x3li8P9M9g_c3ce59jU
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: ${SB_KEY}" \
            "${SB_URL}/rest/v1/datos?select=user_id&limit=1" || true)
          echo "Respuesta HTTP: ${code}"
          # 2xx-4xx = el proyecto responde (un 401/403 es lo esperado sin sesión).
          # 000 (sin respuesta) o 5xx = proyecto pausado o caído -> falla para avisar.
          case "${code}" in
            2*|3*|4*) echo "Proyecto activo." ;;
            *) echo "El proyecto no responde."; exit 1 ;;
          esac
